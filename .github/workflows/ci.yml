name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the client
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f client/dist/index.html
          test -f client/dist/manifest.webmanifest
          test -f client/dist/sw.js
          test -f client/dist/icon-512.png
          test -d client/dist/assets
          echo "client build OK"

      - name: Syntax check every server file
        run: |
          set -euo pipefail
          find server api -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
          echo "server syntax OK"

      - name: WhatsApp auth store round-trip
        run: npm run test:authstore

      - name: Upload built client
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

      # Download this, commit it, and `npm ci` works again everywhere.
      - name: Upload refreshed package-lock.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: warn

  api:
    name: API tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]

    # Only started for the postgres leg; the sqlite leg ignores it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sendtowp
          POSTGRES_PASSWORD: sendtowp
          POSTGRES_DB: sendtowp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Run the API suite
        env:
          # The postgres leg exercises the pg driver, the `?`->`$n` rewriting,
          # SERIAL ids via RETURNING, and quoted PascalCase identifiers.
          DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgres://sendtowp:sendtowp@127.0.0.1:5432/sendtowp' || '' }}
          PGSSL: disable
          DB_PATH: /tmp/ci-${{ matrix.backend }}.db
          WHATSAPP_AUTH_PATH: /tmp/ci-wa-${{ matrix.backend }}
        run: npm run test:api

      - name: Auth store round-trip on this backend
        env:
          DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgres://sendtowp:sendtowp@127.0.0.1:5432/sendtowp' || '' }}
          PGSSL: disable
        run: npm run test:authstore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sendtowp:ci
      - name: Container starts and answers health checks
        run: |
          set -euo pipefail
          docker run -d --name sendtowp-ci -p 3000:3000 \
            -e JWT_SECRET=ci-only-secret-long-enough-to-pass-the-32-char-check \
            sendtowp:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "container healthy"; docker rm -f sendtowp-ci; exit 0
            fi
            sleep 2
          done
          echo "container never became healthy:"; docker logs sendtowp-ci; exit 1
