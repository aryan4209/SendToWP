name: Keepalive

# Pings the deployed app so a free-tier host does not spin down and a free-tier
# database is not judged inactive.
#
# SETUP: add a repository variable named KEEPALIVE_URL pointing at your
# deployment, e.g. https://your-app.onrender.com/api/keepalive
# (Settings -> Secrets and variables -> Actions -> Variables -> New variable)
#
# Without that variable every run exits immediately, so this is harmless if you
# deploy somewhere that never sleeps.
#
# LIMITS worth knowing before you rely on this:
#   - GitHub's minimum schedule is 5 minutes, and runs are frequently delayed by
#     10-15 minutes under load. Render spins down at 15 minutes idle, so this is
#     cutting it fine. cron-job.org (free, 1-minute intervals) is more reliable.
#   - Scheduled workflows are disabled automatically after 60 days without any
#     repository activity. GitHub emails you first.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the deployment
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          set -uo pipefail

          if [ -z "${KEEPALIVE_URL:-}" ]; then
            echo "KEEPALIVE_URL is not set - nothing to ping. See this file's header."
            exit 0
          fi

          # A cold free instance can take ~60s to boot, so retry rather than
          # failing the run on the first timeout.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 90 "$KEEPALIVE_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK on attempt $attempt"
              cat /tmp/body.txt
              exit 0
            fi
            echo "attempt $attempt returned $code, retrying in 20s"
            sleep 20
          done

          echo "Keepalive failed after 5 attempts. Last response:"
          cat /tmp/body.txt || true
          exit 1
